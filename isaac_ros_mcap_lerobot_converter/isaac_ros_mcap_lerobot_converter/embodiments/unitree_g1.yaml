name: unitree_g1
observations:
  state.left_leg:
    type: joint_position
    source_topic: /joint_states
    element_names:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
  state.right_leg:
    type: joint_position
    source_topic: /joint_states
    element_names:
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
  state.waist:
    type: joint_position
    source_topic: /joint_states
    element_names:
      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint
  state.left_arm:
    type: joint_position
    source_topic: /joint_states
    element_names:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
  state.right_arm:
    type: joint_position
    source_topic: /joint_states
